
<!DOCTYPE html>
<html lang="en-GB" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PECO-Buddy 8.1.1 Beta</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.5.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-docx-js@1.8.0/dist/html-to-docx.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@^1.35.0"
      }
    }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="antialiased bg-slate-50 text-slate-800">

    <aside id="app-sidebar" class="fixed top-0 left-0 z-40 w-72 h-screen bg-white border-r border-slate-200 flex flex-col overflow-y-auto">
        <div class="flex items-center gap-4 p-6 pb-8 shrink-0">
            <div class="w-12 h-12 rounded-2xl bg-teal-600 flex items-center justify-center text-white shadow-lg">
                <i class="fa-solid fa-robot fa-2x"></i>
            </div>
            <div>
                 <h1 class="text-xl font-extrabold text-slate-800">PECO-Buddy</h1>
                 <p class="text-[10px] font-bold uppercase tracking-widest text-teal-600">8.1.1 Beta</p>
            </div>
        </div>

        <nav id="sidebar-nav" class="flex-grow px-4 space-y-1">
            <p class="px-4 py-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Workspaces</p>
            <a href="#" data-mode="peco_toolkit" class="sidebar-link active"><i class="fa-solid fa-pen-to-square"></i><span>PECO Toolkit</span></a>
            <a href="#" data-mode="review_peco" class="sidebar-link"><i class="fa-solid fa-file-contract"></i><span>Review PECO</span></a>
            <a href="#" data-mode="nlp" class="sidebar-link"><i class="fa-solid fa-sliders"></i><span>NLP Toolkit</span></a>
        </nav>

        <div class="mt-auto p-4 space-y-1 border-t border-slate-100">
             <a href="#" id="notebook-toggle-btn" class="sidebar-link group justify-between">
                <span class="flex items-center gap-3"><i class="fa-solid fa-notebook"></i>Notebook</span>
                <i class="fa-solid fa-chevron-down text-xs opacity-50 group-hover:opacity-100 transition-opacity"></i>
             </a>
             <div id="notebook-content" class="overflow-hidden transition-all duration-300" style="max-height: 0;">
                <div class="px-2 pb-2 space-y-2">
                    <div class="notebook-section border rounded-xl p-2 bg-slate-50">
                        <div class="notebook-section-header flex justify-between items-center cursor-pointer mb-1">
                            <h4 class="text-[10px] font-bold uppercase text-slate-400">Scoping</h4>
                            <i class="fa-solid fa-chevron-down text-[10px] text-slate-300"></i>
                        </div>
                        <div class="notebook-section-body space-y-2">
                            <textarea class="w-full text-xs p-2 rounded-lg h-16" data-notebook-key="researchScope" placeholder="Research scope..."></textarea>
                            <textarea class="w-full text-xs p-2 rounded-lg h-16" data-notebook-key="finalQuestion" placeholder="Finalised question..."></textarea>
                        </div>
                    </div>
                    <div class="notebook-section border rounded-xl p-2 bg-slate-50">
                        <div class="notebook-section-header flex justify-between items-center cursor-pointer mb-1">
                            <h4 class="text-[10px] font-bold uppercase text-slate-400">PECO Data</h4>
                            <i class="fa-solid fa-chevron-down text-[10px] text-slate-300"></i>
                        </div>
                        <div class="notebook-section-body space-y-2">
                            <textarea class="w-full text-[10px] p-2 rounded-lg h-12" data-notebook-key="population" placeholder="Population..."></textarea>
                            <textarea class="w-full text-[10px] p-2 rounded-lg h-12" data-notebook-key="exposure" placeholder="Exposure..."></textarea>
                            <textarea class="w-full text-[10px] p-2 rounded-lg h-12" data-notebook-key="comparison" placeholder="Comparison..."></textarea>
                            <textarea class="w-full text-[10px] p-2 rounded-lg h-12" data-notebook-key="outcome" placeholder="Outcome..."></textarea>
                        </div>
                    </div>
                    <div class="notebook-footer flex gap-2 pt-2">
                        <button id="notebook-import-btn" class="text-[10px] font-bold text-teal-600 uppercase">Import</button>
                        <input type="file" id="notebook-import-input" class="hidden" accept=".json">
                        <button id="notebook-export-json-btn" class="text-[10px] font-bold text-teal-600 uppercase ml-auto">Export</button>
                    </div>
                </div>
             </div>
             
             <div class="pt-2">
                 <a href="#" id="show-settings-btn" class="sidebar-link"><i class="fa-solid fa-cog"></i><span>Settings</span></a>
                 <a href="#" id="show-manual-btn" class="sidebar-link"><i class="fa-solid fa-book-open"></i><span>User Manual</span></a>
                 <a href="#" id="show-rationale-btn" class="sidebar-link"><i class="fa-solid fa-code-merge"></i><span>Version Rationale</span></a>
                 <a href="#" id="show-copyright-btn" class="sidebar-link"><i class="fa-solid fa-copyright"></i><span>Copyright Notice</span></a>
             </div>

             <div class="p-4 mt-2 border-t border-slate-50 bg-slate-50/50">
                 <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest text-center">PECO-Buddy v8.1.1</p>
             </div>
        </div>
    </aside>

    <div id="app-main-content" class="sm:ml-72 min-h-screen flex flex-col">
        <div id="app-container" class="max-w-6xl mx-auto p-6 lg:p-12 w-full flex-grow flex flex-col">
            <header class="flex justify-between items-end mb-10">
                <div>
                    <p id="header-subtitle" class="text-sm font-bold text-teal-600 uppercase tracking-wider mb-1">Workspace</p>
                    <h1 id="header-title" class="text-4xl font-extrabold text-slate-900 tracking-tight">PECO Toolkit</h1>
                </div>
                <div class="flex items-center gap-3">
                    <button id="toggle-tooltips-btn" class="w-10 h-10 rounded-full bg-white text-slate-400 shadow-sm hover:text-teal-600 hover:shadow-md transition-all flex items-center justify-center relative group" title="Toggle Tooltips">
                        <i class="fa-solid fa-comment-dots text-lg"></i>
                        <span class="absolute top-0 right-0 w-3 h-3 bg-teal-500 rounded-full border-2 border-white status-indicator" style="display: none;"></span>
                    </button>
                </div>
            </header>
            <main id="main-content" class="flex-grow"></main>
        </div>
    </div>

    <div id="toast-container"></div>
    <div id="modal-placeholder"></div>
    <div id="global-tooltip" class="hidden absolute z-50 px-3 py-2 text-xs font-semibold text-white bg-slate-800 rounded-lg shadow-xl border border-white/10 pointer-events-none transition-opacity duration-150"></div>

    <script type="module" src="./index.js"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
